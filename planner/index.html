<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=https://planner.alexschuller.com/">
<title>Redirecting…</title>
<link rel="canonical" href="https://planner.alexschuller.com/">
<script>
  /* This address used to install the planner as an app, so a browser here may
     still serve the old copy out of a cache and never reach the redirect. */
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.getRegistrations()
      .then(function (list) { list.forEach(function (r) { r.unregister(); }); })
      .catch(function () {});
  }
  if (window.caches && caches.keys) {
    caches.keys()
      .then(function (names) { names.forEach(function (n) { caches.delete(n); }); })
      .catch(function () {});
  }
  location.replace("https://planner.alexschuller.com/");
</script>
</head>
<body>
<p><a href="https://planner.alexschuller.com/">planner.alexschuller.com</a></p>
</body>
</html>
